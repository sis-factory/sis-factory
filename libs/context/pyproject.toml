[project]
name = "sif-context"
version = "0.1.0"
description = "Chunking, safety, ranking, connectors and storage for the sif context (RAG) pipeline"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "httpx>=0.27", "beautifulsoup4>=4.12", "psycopg[binary,pool]>=3.3.6", "injection-guard"]

[tool.uv.sources]
injection-guard = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sif_context"]
