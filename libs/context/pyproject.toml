[project]
name = "sis-context"
version = "0.1.0"
description = "Chunking, safety, ranking, connectors and storage for the sis context (RAG) pipeline"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14.3", "httpx>=0.27", "beautifulsoup4>=4.12", "psycopg[binary,pool]>=3.2", "injection-guard"]

[tool.uv.sources]
injection-guard = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sis_context"]
