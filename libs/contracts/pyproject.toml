[project]
name = "sis-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts, settings and pure policy rules for sis services"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14.3", "pydantic-settings>=2", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sis_contracts"]
