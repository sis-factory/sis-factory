[project]
name = "portal-api"
version = "0.1.0"
description = "Task history, cost and live event stream for the sif dashboard and 3D view"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary,pool]>=3.3.6", "sif-contracts", "injection-guard", "sif-context", "cryptography>=43", "temporalio>=1.7", "httpx>=0.27"]

[tool.uv.sources]
sif-contracts = { workspace = true }
injection-guard = { workspace = true }
sif-context = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portal_api"]
