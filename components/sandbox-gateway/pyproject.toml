[project]
name = "sandbox-gateway"
version = "0.1.0"
description = "The only service an agent sandbox can reach: task, LLM proxy with budget, questions, results"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162.2", "uvicorn>=0.30", "httpx>=0.27", "temporalio>=1.7", "injection-guard", "sis-contracts"]

[tool.uv.sources]
injection-guard = { workspace = true }
sis-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_gateway"]
