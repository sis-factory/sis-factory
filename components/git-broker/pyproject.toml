[project]
name = "git-broker"
version = "0.1.0"
description = "The only component that holds GitHub write credentials: checkout, patch publishing and pull requests"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162.2", "uvicorn>=0.30", "httpx>=0.27", "cryptography>=42", "injection-guard", "sis-contracts"]

[tool.uv.sources]
injection-guard = { workspace = true }
sis-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_broker"]
