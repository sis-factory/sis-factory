[project]
name = "sandbox-provisioner"
version = "0.1.0"
description = "Creates and destroys isolated agent sandboxes (Podman locally, Kubernetes with gVisor in a cluster)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162.2", "uvicorn>=0.30", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_provisioner"]
