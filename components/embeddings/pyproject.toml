[project]
name = "embeddings-service"
version = "0.1.0"
description = "OpenAI-compatible /v1/embeddings server (local ONNX model via fastembed, or an offline hash fallback)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162.2", "uvicorn>=0.30", "fastembed>=0.4", "sis-context"]

[tool.uv.sources]
sis-context = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embeddings_service"]
