[project]
name = "injection-guard"
version = "0.1.0"
description = "Prompt-injection scanning, spotlighting, canaries and outbound checks for untrusted text"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.14.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/injection_guard"]
